configs:
  ## Number of domains to check in each chunk
  checkerChunk: 5
  ## Timeout for each checker in milliseconds
  checkerTimeout: 5000

  ## Number of retries for each checker
  checkerRetries: 5
  ## Initial backoff time for each checker in milliseconds
  checkerBackoffInit: 2500
  ## Backoff factor for each checker
  checkerBackoffFactor: 2

  checkers:
    _default: [rdap, whois, dns]

    co: [whois]
    io: [whois]
    me: [whois]
    in.th: [pathosting]
    co.th: [pathosting]
